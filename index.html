<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii Web - 3D Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <!-- Global WebGL Container -->
    <div id="webgl-container"></div>

    <!-- Liquid Glass Camera HUD -->
    <div id="hud-container" class="glass-ui">
        <video id="input_video" style="display: none;" autoplay playsinline></video>
        <canvas id="output_canvas" width="240" height="180"></canvas>
        <div id="loading-hud">SENSING...</div>
    </div>

    <!-- VIRTUAL CURSOR LAYER -->
    <canvas id="cursor-canvas"></canvas>

    <!-- MAIN APP CONTAINER -->
    <div id="main-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1 class="brand-title">WII WEB</h1>
            <p class="subtitle">CYBER GREEN EDITION</p>
            
            <div class="menu-layout">
                <button class="wii-btn btn-primary glass-ui" onclick="navTo('select-screen')">ENTER SYSTEM</button>
                <button class="wii-btn btn-secondary glass-ui" onclick="navTo('system-settings-screen')">GLOBAL SETTINGS</button>
            </div>
        </div>

        <!-- GLOBAL SYSTEM SETTINGS -->
        <div id="system-settings-screen" class="screen">
            <h1 class="screen-title">System Configuration</h1>
            
            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%;">
                <h2>Camera Sensitivity</h2>
                <p>Adjust how much your physical hand moves the cursor.</p>
                <div class="menu-layout row" id="sensitivity-options">
                    <button class="wii-btn glass-ui" onclick="setSensitivity(0.8, this)">Low</button>
                    <button class="wii-btn glass-ui selected" onclick="setSensitivity(1.2, this)">Balanced</button>
                    <button class="wii-btn glass-ui" onclick="setSensitivity(1.8, this)">High</button>
                </div>
            </div>
            <br>
            <button class="wii-btn btn-back glass-ui" onclick="navTo('start-screen')">BACK</button>
        </div>

        <!-- GAME LIBRARY SCREEN -->
        <div id="select-screen" class="screen">
            <h1 class="screen-title">Select Module</h1>
            
            <div class="game-carousel">
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('pong')">
                    <h2>AIR HOCKEY 3D</h2>
                    <p>Enter the Grid.</p>
                </div>
                
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('tennis')">
                    <h2>COURT TENNIS</h2>
                    <p>Coming Soon</p>
                </div>
                
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('moto')">
                    <h2>MOTO RACER</h2>
                    <p>Coming Soon</p>
                </div>
            </div>
            
            <button class="wii-btn btn-back glass-ui" style="margin-top: 50px;" onclick="navTo('start-screen')">BACK</button>
        </div>

        <!-- PER-GAME HUB (Settings specific to the selected game) -->
        <div id="game-hub-screen" class="screen">
            <h1 class="screen-title" id="game-hub-title">GAME CONFIG</h1>
            
            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%; margin-bottom: 20px;">
                <h2>Players</h2>
                <div class="menu-layout row" id="player-options">
                    <button class="wii-btn glass-ui selected" onclick="setGameMode(1, this)">1 Player (Vs System)</button>
                    <button class="wii-btn glass-ui" onclick="setGameMode(2, this)">2 Players (Split-Screen)</button>
                </div>
            </div>

            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%; margin-bottom: 40px;">
                <h2>Difficulty Level</h2>
                <div class="menu-layout row" id="difficulty-options">
                    <button class="wii-btn glass-ui selected" onclick="setGameDifficulty(1, 5, this)">Fácil (5pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(1.5, 10, this)">Médio (10pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(2, 15, this)">Difícil (15pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(3, 20, this)" style="color: #ff3366; border-color: #ff3366;">EXTREMO (20pts)</button>
                </div>
            </div>

            <button class="wii-btn btn-primary glass-ui" onclick="launchGame()">LAUNCH PROTOCOL</button>
            <button class="wii-btn btn-back glass-ui" onclick="navTo('select-screen')">BACK</button>
        </div>

        <!-- IN-GAME HUD -->
        <div id="game-ui-screen" class="screen">
            <button class="wii-btn back-btn glass-ui" onclick="backToMenu()">ABORT PROTOCOL</button>
            <div id="score-board" style="display: none; width: 100%; justify-content: space-between; position: absolute; top: 50px; padding: 0 100px; box-sizing: border-box; font-size: 6em; font-weight: 800; pointer-events: none; text-shadow: 0 0 20px #37b24d;">
                <span id="p1-score-txt" style="color: #AFED91;">0</span>
                <span id="p2-score-txt" style="color: #FFFFFF;">0</span>
            </div>
            <div id="winner-text" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5em; font-weight: 800; color: white; text-shadow: 0 0 30px #AFED91; text-align: center; text-transform: uppercase;"></div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="motion.js"></script>
    <script src="engine3d.js"></script>
    <script src="app.js"></script>
</body>
</html>
