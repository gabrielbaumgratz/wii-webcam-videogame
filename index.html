<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii Web - 3D Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <!-- Global WebGL Container -->
    <div id="webgl-container"></div>

    <!-- Liquid Glass Camera HUD -->
    <div id="hud-container" class="glass-ui">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="240" height="180"></canvas>
        <div id="loading-hud">SENSING...</div>
    </div>

    <!-- VIRTUAL CURSOR LAYER -->
    <canvas id="cursor-canvas"></canvas>

    <!-- LANGUAGE SELECTOR -->
    <div id="lang-selector">
        <div class="lang-btn selected" onclick="setLang('pt')">
            <img src="https://flagcdn.com/w40/br.png" alt="BR"> <span>PT</span>
        </div>
        <div class="lang-btn" onclick="setLang('en')">
            <img src="https://flagcdn.com/w40/us.png" alt="US"> <span>EN</span>
        </div>
        <div class="lang-btn" onclick="setLang('es')">
            <img src="https://flagcdn.com/w40/es.png" alt="ES"> <span>ES</span>
        </div>
        <div class="lang-btn" onclick="setLang('de')">
            <img src="https://flagcdn.com/w40/de.png" alt="DE"> <span>DE</span>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="main-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <img src="logo.png" alt="Wii Web Minigames" class="brand-logo">
            <p class="subtitle" data-i18n="subtitle">JOGUE USANDO APENAS A CÂMERA</p>
            
            <div class="menu-layout">
                <button class="wii-btn btn-primary" onclick="navTo('select-screen')" data-i18n="enter_system">ENTRAR NO SISTEMA</button>
                <button class="wii-btn btn-secondary" onclick="navTo('system-settings-screen')" data-i18n="global_settings">CONFIG. GLOBAIS</button>
            </div>
        </div>

        <!-- GLOBAL SYSTEM SETTINGS -->
        <div id="system-settings-screen" class="screen">
            <h1 class="screen-title" data-i18n="sys_config_title">Configuração do Sistema</h1>
            
            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%;">
                <h2 data-i18n="cam_sens_title">Sensibilidade da Câmera</h2>
                <p data-i18n="cam_sens_desc">Ajusta o quanto sua mão real move o cursor.</p>
                <div class="menu-layout row" id="sensitivity-options">
                    <button class="wii-btn glass-ui" onclick="setSensitivity(1.5, this)" data-i18n="sens_low">Baixa</button>
                    <button class="wii-btn glass-ui selected" onclick="setSensitivity(2.0, this)" data-i18n="sens_balanced">Normal</button>
                    <button class="wii-btn glass-ui" onclick="setSensitivity(3.0, this)" data-i18n="sens_high">Alta</button>
                </div>
            </div>
            <br>
            <button class="wii-btn btn-back glass-ui" onclick="navTo('start-screen')" data-i18n="btn_back">VOLTAR</button>
        </div>

        <!-- GAME LIBRARY SCREEN -->
        <div id="select-screen" class="screen">
            <h1 class="screen-title" data-i18n="select_module">Selecionar Módulo</h1>
            
            <div class="game-carousel">
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('pong')">
                    <h2>AIR HOCKEY 3D</h2>
                    <p data-i18n="hockey_desc">Entre no Grid.</p>
                </div>
                
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('tennis')">
                    <h2 data-i18n="tennis_title">TÊNIS DE QUADRA</h2>
                    <p data-i18n="coming_soon">Em Breve</p>
                </div>
                
                <div class="game-card wii-btn glass-ui" onclick="openGameHub('moto')">
                    <h2>MOTO RACER</h2>
                    <p data-i18n="coming_soon">Em Breve</p>
                </div>
            </div>
            
            <button class="wii-btn btn-back glass-ui" style="margin-top: 50px;" onclick="navTo('start-screen')" data-i18n="btn_back">VOLTAR</button>
        </div>

        <!-- PER-GAME HUB -->
        <div id="game-hub-screen" class="screen">
            <h1 class="screen-title" id="game-hub-title">GAME CONFIG</h1>
            
            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%; margin-bottom: 20px;">
                <h2 data-i18n="players_title">Jogadores</h2>
                <div class="menu-layout row" id="player-options">
                    <button class="wii-btn glass-ui selected" onclick="setGameMode(1, this)" data-i18n="mode_1p">1 Jogador (Vs Máquina)</button>
                    <button class="wii-btn glass-ui" onclick="setGameMode(2, this)" data-i18n="mode_2p">2 Jogadores (Tela Dividida)</button>
                </div>
            </div>

            <div class="glass-ui" style="padding: 40px; text-align: center; width: 80%; margin-bottom: 40px;">
                <h2 data-i18n="diff_title">Nível de Dificuldade</h2>
                <div class="menu-layout row" id="difficulty-options">
                    <button class="wii-btn glass-ui selected" onclick="setGameDifficulty(1, 5, this)" data-i18n="diff_easy">Fácil (5pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(1.5, 10, this)" data-i18n="diff_med">Médio (10pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(2, 15, this)" data-i18n="diff_hard">Difícil (15pts)</button>
                    <button class="wii-btn glass-ui" onclick="setGameDifficulty(3, 20, this)" style="color: #ff3366; border-color: #ff3366;" data-i18n="diff_ext">EXTREMO (20pts)</button>
                </div>
            </div>

            <button class="wii-btn btn-primary glass-ui" onclick="launchGame()" data-i18n="btn_launch">INICIAR PROTOCOLO</button>
            <button class="wii-btn btn-back glass-ui" onclick="navTo('select-screen')" data-i18n="btn_back">VOLTAR</button>
        </div>

        <!-- IN-GAME HUD -->
        <div id="game-ui-screen" class="screen">
            <button class="wii-btn back-btn glass-ui" onclick="backToMenu()" data-i18n="btn_abort">ABORTER PROTOCOLO</button>
            <div id="score-board" style="display: none; width: 100%; justify-content: space-between; position: absolute; top: 50px; padding: 0 100px; box-sizing: border-box; font-size: 6em; font-weight: 800; pointer-events: none; text-shadow: 0 0 20px #000;">
                <span id="p1-score-txt" style="color: #FF3333; text-shadow: 0 0 20px #FF3333;">0</span>
                <span id="p2-score-txt" style="color: #3366FF; text-shadow: 0 0 20px #3366FF;">0</span>
            </div>
            <div id="winner-text" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5em; font-weight: 800; color: white; text-shadow: 0 0 30px #ffffff; text-align: center; text-transform: uppercase;"></div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="motion.js"></script>
    <script src="engine3d.js"></script>
    <script src="app.js"></script>
</body>
</html>
